<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super POMP World - Happy Birthday Krub</title>

<!-- โหลดฟอนต์พิกเซลจาก Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  /* ========================================================
     ส่วนที่ 1: CSS พื้นฐานและธีมตู้เกมย้อนยุค (Arcade Theme)
     ======================================================== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0d0221;
    color: #fff;
    font-family: 'Press Start 2P', cursive;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    /* ลายเส้นสแกนไลน์แบบจอทีวีย้อนยุค */
    background-image:
      radial-gradient(circle at 50% 0%, #2b0a4a 0%, #0d0221 70%);
  }

  #game-container {
    position: relative;
    width: 800px;
    max-width: 96vw;
    border: 6px solid #ff8a00;
    box-shadow:
      0 0 0 4px #000,
      0 0 25px 6px rgba(255, 138, 0, 0.6);
    background: #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated; /* คงความคมชัดของพิกเซล */
    background: #87ceeb;
  }

  /* ========================================================
     ส่วนที่ 2: หน้าจอเริ่มต้นเกม (Start Screen)
     ======================================================== */
  #start-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #1a0033 0%, #3a0068 60%, #1a0033 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }

  #start-screen h1 {
    font-size: 34px;
    color: #ffd400;
    text-shadow:
      3px 3px 0 #ff2e63,
      6px 6px 0 #000;
    letter-spacing: 2px;
    margin-bottom: 14px;
  }

  #start-screen .subtitle {
    font-size: 12px;
    color: #7be0ff;
    margin-bottom: 40px;
    line-height: 1.8;
  }

  #press-start {
    font-size: 16px;
    color: #fff;
    animation: blink 1s steps(1) infinite;
    cursor: pointer;
    padding: 10px 18px;
    border: 3px solid #fff;
    background: rgba(255,255,255,0.05);
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* พิกเซลตัวละครเล็กๆ ประดับหน้า Start Screen (วาดด้วย box-shadow แบบ pixel-art) */
  #start-sprite {
    width: 8px;
    height: 8px;
    margin-bottom: 24px;
    transform: scale(6);
    image-rendering: pixelated;
  }

  /* ========================================================
     ส่วนที่ 3: HUD (แสดงจำนวนไอเทมที่เก็บได้)
     ======================================================== */
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    font-size: 12px;
    color: #ffd400;
    text-shadow: 2px 2px 0 #000;
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    display: none;
  }

  #instructions {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    font-size: 8px;
    color: #7be0ff;
    text-shadow: 1px 1px 0 #000;
    background: rgba(0,0,0,0.4);
    padding: 6px 8px;
    display: none;
    line-height: 1.6;
  }

  /* ========================================================
     ส่วนที่ 4: Modal Pop-up สำหรับข้อความอวยพรวันเกิด (Surprise)
     ======================================================== */
  #hbd-modal {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  #hbd-modal.show {
    display: flex;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #hbd-box {
    background: linear-gradient(180deg, #ff2e63 0%, #ff8a00 100%);
    border: 5px solid #fff;
    box-shadow: 0 0 0 5px #000, 0 0 40px 10px rgba(255,212,0,0.8);
    padding: 30px 22px;
    max-width: 640px;
    text-align: center;
    animation: popIn 0.5s cubic-bezier(.36,1.5,.64,1) both;
  }

  @keyframes popIn {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  #hbd-box .emoji-row {
    font-size: 28px;
    margin-bottom: 16px;
  }

  #hbd-box h2 {
    font-size: 16px;
    color: #ffd400;
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  #hbd-box p {
    font-size: 12px;
    color: #fff;
    line-height: 2.1;
    text-shadow: 1px 1px 0 #000;
    margin-bottom: 24px;
  }

  #hbd-close {
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    padding: 10px 20px;
    background: #1a0033;
    color: #ffd400;
    border: 3px solid #ffd400;
    cursor: pointer;
  }
  #hbd-close:hover {
    background: #ffd400;
    color: #1a0033;
  }

  /* Canvas เอฟเฟกต์พลุพิกเซล วางซ้อนด้านบนสุด */
  #fireworks-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 40;
    pointer-events: none;
    display: none;
  }

  /* ========================================================
     ส่วนที่ 5: ปุ่มควบคุมบนหน้าจอ (Touch Controls)
     ใช้ทั้งบนมือถือ (แตะ) และคอมพิวเตอร์ (คลิกเมาส์)
     ======================================================== */
  #touch-controls {
    position: absolute;
    bottom: 14px;
    left: 0;
    width: 100%;
    z-index: 30;
    display: none; /* จะเปิดเป็น flex ตอนเริ่มเกม */
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 16px;
    pointer-events: none; /* container เองไม่บล็อกคลิก ให้ปุ่มด้านในรับแทน */
  }

  #move-buttons, #action-buttons {
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }

  .ctrl-btn {
    width: 54px;
    height: 54px;
    background: rgba(20, 5, 40, 0.75);
    border: 3px solid #ffd400;
    color: #ffd400;
    font-family: 'Press Start 2P', cursive;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    box-shadow: 0 0 10px rgba(255, 212, 0, 0.5);
  }

  .ctrl-btn:active,
  .ctrl-btn.active-press {
    background: #ffd400;
    color: #1a0033;
  }

  #jump-btn {
    width: 70px;
    height: 70px;
    font-size: 11px;
    border-color: #4ad4ff;
    color: #4ad4ff;
    box-shadow: 0 0 10px rgba(74, 212, 255, 0.5);
  }

  #jump-btn:active,
  #jump-btn.active-press {
    background: #4ad4ff;
    color: #1a0033;
  }

  /* ปุ่มควบคุมแสดงเฉพาะตอนกำลังเล่นเกมเท่านั้น (คุมด้วย JS toggle class) */
  #touch-controls.visible {
    display: flex;
  }
</style>
</head>
<body>

<div id="game-container">

  <!-- ===================== START SCREEN ===================== -->
  <div id="start-screen">
    <h1>SUPER POMP WORLD</h1>
    <div class="subtitle">A BIRTHDAY QUEST FOR THE BEST DAD</div>
    <div id="press-start">▶ PRESS START TO PLAY ◀</div>
  </div>

  <!-- ===================== HUD ===================== -->
  <div id="hud">ITEMS: <span id="item-count">0</span> / 5</div>
  <div id="instructions">◀ ▶ : MOVE<br>SPACE / ▲ : JUMP</div>

  <!-- ===================== เกมหลัก (Canvas) ===================== -->
  <canvas id="game-canvas" width="800" height="450"></canvas>

  <!-- ===================== เอฟเฟกต์พลุพิกเซล ===================== -->
  <canvas id="fireworks-canvas" width="800" height="450"></canvas>

  <!-- ===================== ปุ่มควบคุมบนหน้าจอ (Touch Controls) ===================== -->
  <div id="touch-controls">
    <div id="move-buttons">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div id="action-buttons">
      <div class="ctrl-btn" id="jump-btn">JUMP</div>
    </div>
  </div>

  <!-- ===================== POP-UP อวยพรวันเกิด ===================== -->
  <div id="hbd-modal">
    <div id="hbd-box">
      <div class="emoji-row">🎂🎉🎁</div>
      <h2>LEVEL CLEAR!</h2>
      <p>สุขสันต์นะฅรับพ่อจ๋า<br>
      อายุครบ 48 ปีแล้ว<br>
      ขอให้พ่อจ๋าร่ำรวยมั่งมีเงินทอง<br>
      สุขภาพร่างกายแข็งแรง<br>
      อยู่ด้วยกันไปนาน ๆ นะพ่อจ๋า</p>
      <button id="hbd-close">THANK YOU ❤</button>
    </div>
  </div>

  <!-- เสียงเพลงประกอบ: ผู้ใช้สามารถนำไฟล์เพลงของตัวเองมาใส่ src ตรงนี้ได้ -->
  <audio id="bgm" loop>
     <source src="hbd-dad.mp3" type="audio/mpeg">
</audio>

</div>
  <script>
/* ---------- 1. SETUP & GLOBAL STATE ---------- */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND_Y = H - 60;

let gameState = 'start';
let itemsCollected = 0;
const TOTAL_ITEMS = 5;
let winFadeAlpha = 0;

const keys = { left: false, right: false, up: false };
const bgm = document.getElementById('bgm');

/* ---------- 5. PHYSICS & CONTROLS ---------- */
document.addEventListener('keydown', (e) => {
  if (gameState !== 'playing') return;
  if (e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
});

function bindHoldButton(el, onPress, onRelease) {
  const press = (e) => {
    e.preventDefault();
    if (gameState !== 'playing') return;
    el.classList.add('active-press');
    onPress();
  };
  const release = (e) => {
    e.preventDefault();
    el.classList.remove('active-press');
    onRelease();
  };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const jumpBtn = document.getElementById('jump-btn');

bindHoldButton(btnLeft, () => { keys.left = true; player.facing = -1; }, () => keys.left = false);
bindHoldButton(btnRight, () => { keys.right = true; player.facing = 1; }, () => keys.right = false);
bindHoldButton(jumpBtn, () => { keys.up = true; }, () => keys.up = false);

/* ---------- START GAME LOGIC (กดแล้วเพลงดัง) ---------- */
const startScreen = document.getElementById('start-screen');
const pressStartBtn = document.getElementById('press-start');
const hud = document.getElementById('hud');
const instructions = document.getElementById('instructions');
const touchControls = document.getElementById('touch-controls');

pressStartBtn.addEventListener('click', () => {
  if (gameState === 'start') {
    gameState = 'playing';
    startScreen.style.display = 'none';
    hud.style.display = 'block';
    instructions.style.display = 'block';
    touchControls.classList.add('visible');
    
    // สั่งเล่นเพลงประกอบทันทีเมื่อกดปุ่ม Start
    bgm.play().catch(err => console.log("Audio block:", err));
    
    resetItems();
    gameLoop();
  }
});

/* ---------- 6. COLLISION & SCORE ---------- */
function checkCollisions() {
  items.forEach(it => {
    if (!it.collected) {
      if (player.x < it.x + it.w && player.x + player.w > it.x &&
          player.y < it.y + it.h && player.y + player.h > it.y) {
        it.collected = true;
        itemsCollected++;
        document.getElementById('item-count').textContent = itemsCollected;
        
        if (itemsCollected === TOTAL_ITEMS) {
          triggerWin();
        }
      }
    }
  });
}

function triggerWin() {
  gameState = 'win-transition';
  keys.left = false; keys.right = false; keys.up = false;
  document.getElementById('hbd-modal').classList.add('show');
  document.getElementById('fireworks-canvas').style.display = 'block';
  initFireworks();
}

document.getElementById('hbd-close').addEventListener('click', () => {
  document.getElementById('hbd-modal').classList.remove('show');
  gameState = 'won';
});

/* ---------- 8. PIXEL FIREWORKS ---------- */
const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');
let particles = [];

function initFireworks() {
  particles = [];
}

function updateFireworks() {
  if (Math.random() < 0.05) {
    const rx = Math.random() * W;
    const ry = Math.random() * (H / 2);
    const colors = ['#ff2e63', '#ffd400', '#4ad4ff', '#7bff8a', '#ff8a00'];
    const col = colors[Math.floor(Math.random() * colors.length)];
    for(let i=0; i<30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      particles.push({
        x: rx, y: ry,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: col, alpha: 1,
        life: Math.random() * 30 + 30
      });
    }
  }
  
  particles.forEach((p, idx) => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--;
    if(p.life <= 0) particles.splice(idx, 1);
  });
}

function drawFireworks() {
  fwCtx.clearRect(0,0,W,H);
  particles.forEach(p => {
    fwCtx.fillStyle = p.color;
    fwCtx.fillRect(Math.round(p.x), Math.round(p.y), 4, 4);
  });
}

/* ---------- 9. GAME LOOP ---------- */
function update() {
  if (gameState === 'playing') {
    if (keys.left) player.x -= player.speed;
    if (keys.right) player.x += player.speed;
    
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;
    
    if (keys.up && !player.jumping) {
      player.vy = JUMP_FORCE;
      player.jumping = true;
    }
    
    player.vy += GRAVITY;
    player.y += player.vy;
    
    if (player.y >= GROUND_Y - player.h) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.jumping = false;
    }
    
    if (keys.left || keys.right) {
      player.walkTimer++;
      if (player.walkTimer > 8) {
        player.walkFrame = player.walkFrame === 0 ? 1 : 0;
        player.walkTimer = 0;
      }
    }
    
    checkCollisions();
  }
  
  if (gameState === 'win-transition' || gameState === 'won') {
    updateFireworks();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  items.forEach(drawItem);
  drawPlayer();
  
  if (gameState === 'win-transition' || gameState === 'won') {
    drawFireworks();
  }
}

function gameLoop() {
  update();
  draw();
  if (gameState === 'playing' || gameState === 'win-transition' || gameState === 'won') {
    requestAnimationFrame(gameLoop);
  }
}

// วาดหน้าแรกเริ่มไว้ก่อน
drawBackground();
drawPlayer();
items.forEach(drawItem);
</script>
