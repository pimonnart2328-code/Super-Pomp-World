<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super POMP World - Happy Birthday Krub</title>

<!-- โหลดฟอนต์พิกเซลจาก Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  /* ========================================================
     ส่วนที่ 1: CSS พื้นฐานและธีมตู้เกมย้อนยุค (Arcade Theme)
     ======================================================== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0d0221;
    color: #fff;
    font-family: 'Press Start 2P', cursive;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    /* ลายเส้นสแกนไลน์แบบจอทีวีย้อนยุค */
    background-image:
      radial-gradient(circle at 50% 0%, #2b0a4a 0%, #0d0221 70%);
  }

  #game-container {
    position: relative;
    width: 800px;
    max-width: 96vw;
    border: 6px solid #ff8a00;
    box-shadow:
      0 0 0 4px #000,
      0 0 25px 6px rgba(255, 138, 0, 0.6);
    background: #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated; /* คงความคมชัดของพิกเซล */
    background: #87ceeb;
  }

  /* ========================================================
     ส่วนที่ 2: หน้าจอเริ่มต้นเกม (Start Screen)
     ======================================================== */
  #start-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #1a0033 0%, #3a0068 60%, #1a0033 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }

  #start-screen h1 {
    font-size: 34px;
    color: #ffd400;
    text-shadow:
      3px 3px 0 #ff2e63,
      6px 6px 0 #000;
    letter-spacing: 2px;
    margin-bottom: 14px;
  }

  #start-screen .subtitle {
    font-size: 12px;
    color: #7be0ff;
    margin-bottom: 40px;
    line-height: 1.8;
  }

  #press-start {
    font-size: 16px;
    color: #fff;
    animation: blink 1s steps(1) infinite;
    cursor: pointer;
    padding: 10px 18px;
    border: 3px solid #fff;
    background: rgba(255,255,255,0.05);
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* พิกเซลตัวละครเล็กๆ ประดับหน้า Start Screen (วาดด้วย box-shadow แบบ pixel-art) */
  #start-sprite {
    width: 8px;
    height: 8px;
    margin-bottom: 24px;
    transform: scale(6);
    image-rendering: pixelated;
  }

  /* ========================================================
     ส่วนที่ 3: HUD (แสดงจำนวนไอเทมที่เก็บได้)
     ======================================================== */
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    font-size: 12px;
    color: #ffd400;
    text-shadow: 2px 2px 0 #000;
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    display: none;
  }

  #instructions {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    font-size: 8px;
    color: #7be0ff;
    text-shadow: 1px 1px 0 #000;
    background: rgba(0,0,0,0.4);
    padding: 6px 8px;
    display: none;
    line-height: 1.6;
  }

  /* ========================================================
     ส่วนที่ 4: Modal Pop-up สำหรับข้อความอวยพรวันเกิด (Surprise)
     ======================================================== */
  #hbd-modal {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  #hbd-modal.show {
    display: flex;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #hbd-box {
    background: linear-gradient(180deg, #ff2e63 0%, #ff8a00 100%);
    border: 5px solid #fff;
    box-shadow: 0 0 0 5px #000, 0 0 40px 10px rgba(255,212,0,0.8);
    padding: 30px 22px;
    max-width: 640px;
    text-align: center;
    animation: popIn 0.5s cubic-bezier(.36,1.5,.64,1) both;
  }

  @keyframes popIn {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  #hbd-box .emoji-row {
    font-size: 28px;
    margin-bottom: 16px;
  }

  #hbd-box h2 {
    font-size: 16px;
    color: #ffd400;
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  #hbd-box p {
    font-size: 12px;
    color: #fff;
    line-height: 2.1;
    text-shadow: 1px 1px 0 #000;
    margin-bottom: 24px;
  }

  #hbd-close {
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    padding: 10px 20px;
    background: #1a0033;
    color: #ffd400;
    border: 3px solid #ffd400;
    cursor: pointer;
  }
  #hbd-close:hover {
    background: #ffd400;
    color: #1a0033;
  }

  /* Canvas เอฟเฟกต์พลุพิกเซล วางซ้อนด้านบนสุด */
  #fireworks-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 40;
    pointer-events: none;
    display: none;
  }

  /* ========================================================
     ส่วนที่ 5: ปุ่มควบคุมบนหน้าจอ (Touch Controls)
     ใช้ทั้งบนมือถือ (แตะ) และคอมพิวเตอร์ (คลิกเมาส์)
     ======================================================== */
  #touch-controls {
    position: absolute;
    bottom: 14px;
    left: 0;
    width: 100%;
    z-index: 30;
    display: none; /* จะเปิดเป็น flex ตอนเริ่มเกม */
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 16px;
    pointer-events: none; /* container เองไม่บล็อกคลิก ให้ปุ่มด้านในรับแทน */
  }

  #move-buttons, #action-buttons {
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }

  .ctrl-btn {
    width: 54px;
    height: 54px;
    background: rgba(20, 5, 40, 0.75);
    border: 3px solid #ffd400;
    color: #ffd400;
    font-family: 'Press Start 2P', cursive;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    box-shadow: 0 0 10px rgba(255, 212, 0, 0.5);
  }

  .ctrl-btn:active,
  .ctrl-btn.active-press {
    background: #ffd400;
    color: #1a0033;
  }

  #jump-btn {
    width: 70px;
    height: 70px;
    font-size: 11px;
    border-color: #4ad4ff;
    color: #4ad4ff;
    box-shadow: 0 0 10px rgba(74, 212, 255, 0.5);
  }

  #jump-btn:active,
  #jump-btn.active-press {
    background: #4ad4ff;
    color: #1a0033;
  }

  /* ปุ่มควบคุมแสดงเฉพาะตอนกำลังเล่นเกมเท่านั้น (คุมด้วย JS toggle class) */
  #touch-controls.visible {
    display: flex;
  }
</style>
</head>

<div id="game-container">

  <div id="start-screen">
    <h1>SUPER POMP WORLD</h1>
    <div class="subtitle">A BIRTHDAY QUEST FOR THE BEST DAD</div>
    <div id="press-start">▶ PRESS START TO PLAY ◀</div>

      ขอให้พ่อจ๋าร่ำรวยมั่งมีเงินทอง<br>

  <audio id="bgm" loop>
     <source src="hbd-dad.mp3" type="audio/mpeg">
</audio>

const canvas = document.getElementById('game-canvas');

const H = canvas.height;

let gameState = 'start';

document.addEventListener('keydown', (e) => {
  if (gameState !== 'playing') return;
  if (e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
});

function bindHoldButton(el, onPress, onRelease) {
  const press = (e) => {
    e.preventDefault();
    if (gameState !== 'playing') return;
    el.classList.add('active-press');
    onPress();
  };
  const release = (e) => {
    e.preventDefault();
    el.classList.remove('active-press');
    onRelease();
  };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const jumpBtn = document.getElementById('jump-btn');

bindHoldButton(btnLeft, () => { keys.left = true; player.facing = -1; }, () => keys.left = false);
bindHoldButton(btnRight, () => { keys.right = true; player.facing = 1; }, () => keys.right = false);
bindHoldButton(jumpBtn, () => { keys.up = true; }, () => keys.up = false);

/* ---------- START GAME LOGIC (กดแล้วเพลงดัง) ---------- */
const startScreen = document.getElementById('start-screen');
const pressStartBtn = document.getElementById('press-start');
const hud = document.getElementById('hud');
const instructions = document.getElementById('instructions');
const touchControls = document.getElementById('touch-controls');

pressStartBtn.addEventListener('click', () => {
  if (gameState === 'start') {
    gameState = 'playing';
    startScreen.style.display = 'none';
    hud.style.display = 'block';
    instructions.style.display = 'block';
    touchControls.classList.add('visible');
    
    // สั่งเล่นเพลงประกอบทันทีเมื่อกดปุ่ม Start
    bgm.play().catch(err => console.log("Audio block:", err));
    
    resetItems();
    gameLoop();
  }
});

/* ---------- 6. COLLISION & SCORE ---------- */
function checkCollisions() {
  items.forEach(it => {
    if (!it.collected) {
      if (player.x < it.x + it.w && player.x + player.w > it.x &&
          player.y < it.y + it.h && player.y + player.h > it.y) {
        it.collected = true;
        itemsCollected++;
        document.getElementById('item-count').textContent = itemsCollected;
        
        if (itemsCollected === TOTAL_ITEMS) {
          triggerWin();
        }
      }
    }
  });
}

function triggerWin() {
  gameState = 'win-transition';
  keys.left = false; keys.right = false; keys.up = false;
  document.getElementById('hbd-modal').classList.add('show');
  document.getElementById('fireworks-canvas').style.display = 'block';
  initFireworks();
}

document.getElementById('hbd-close').addEventListener('click', () => {
  document.getElementById('hbd-modal').classList.remove('show');
  gameState = 'won';
});

/* ---------- 8. PIXEL FIREWORKS ---------- */
const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');
let particles = [];

function initFireworks() {
  particles = [];
}

function updateFireworks() {
  if (Math.random() < 0.05) {

    const col = colors[Math.floor(Math.random() * colors.length)];
    for(let i=0; i<30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      particles.push({
        x: rx, y: ry,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: col, alpha: 1,
        life: Math.random() * 30 + 30
      });
    }
  }
  
  particles.forEach((p, idx) => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--;
    if(p.life <= 0) particles.splice(idx, 1);
  });
}

function drawFireworks() {
  fwCtx.clearRect(0,0,W,H);
  particles.forEach(p => {
    fwCtx.fillStyle = p.color;
    fwCtx.fillRect(Math.round(p.x), Math.round(p.y), 4, 4);
  });
}

function update() {
  if (gameState === 'playing') {
    if (keys.left) player.x -= player.speed;
    if (keys.right) player.x += player.speed;
    
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;

      player.jumping = true;

<script>
/* ============================================================
   SUPER POMP WORLD - Birthday Pixel Game
   โครงสร้างโค้ดแบ่งเป็นส่วนหลักๆ ดังนี้:
   1. Setup & Global State        - ตัวแปรสถานะเกม, canvas context
   2. Player                      - ตัวละครผู้เล่น + สไปรท์แอนิเมชัน
   3. Background / Environment    - ฉากห้องนั่งเล่น
   4. Items                       - ไอเทมที่ต้องเก็บ
   5. Physics & Controls          - แรงโน้มถ่วง, การควบคุม
   6. Collision & Score           - ตรวจชนและนับคะแนน
   7. Win Sequence / Surprise     - ฉากจบเกมและ Pop-up วันเกิด
   8. Pixel Fireworks             - เอฟเฟกต์พลุ
   9. Game Loop                   - ลูปหลักของเกม
   ============================================================ */

/* ---------- 1. SETUP & GLOBAL STATE ---------- */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND_Y = H - 60; // ระดับพื้นห้อง

let gameState = 'start'; // 'start' | 'playing' | 'win-transition' | 'won'
let itemsCollected = 0;
const TOTAL_ITEMS = 5;
let winFadeAlpha = 0;
let winTextTimer = 0;

const keys = { left: false, right: false, up: false };

/* ---------- 2. PLAYER (ตัวละครคุณพ่อ) ---------- */
const player = {
  x: 60,
  y: GROUND_Y - 48,
  w: 24,
  h: 48,
  vy: 0,
  speed: 3.2,
  jumping: false,
  facing: 1,       // 1 = ขวา, -1 = ซ้าย
  walkFrame: 0,
  walkTimer: 0
};

const GRAVITY = 0.55;
const JUMP_FORCE = -11;

// วาดตัวละครผู้เล่นด้วยบล็อกพิกเซล (ผมสั้นดำ, แว่น, เสื้อโปโลส้ม, กางเกงดำ)
function drawPlayer() {
  const px = Math.round(player.x);
  const py = Math.round(player.y);
  const isMoving = keys.left || keys.right;
  const legOffset = isMoving ? (player.walkFrame === 0 ? 3 : -3) : 0;

  ctx.save();

  // เท้า/รองเท้า (สีน้ำตาลเข้ม)
  ctx.fillStyle = '#3a2418';
  ctx.fillRect(px + 2 + legOffset, py + 44, 8, 4);
  ctx.fillRect(px + 14 - legOffset, py + 44, 8, 4);

  // ขากางเกงขายาวสีดำ (สลับขยับเดิน)
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(px + 3 + legOffset, py + 32, 7, 14);
  ctx.fillRect(px + 14 - legOffset, py + 32, 7, 14);

  // ลำตัว: เสื้อโปโลสีส้ม
  ctx.fillStyle = '#ff8a00';
  ctx.fillRect(px + 2, py + 16, 20, 18);
  // ปกเสื้อ
  ctx.fillStyle = '#e06f00';
  ctx.fillRect(px + 9, py + 16, 6, 4);

  // แขน (สีส้มเข้าชุดกับเสื้อ, ขยับเล็กน้อยตอนเดิน)
  ctx.fillStyle = '#ff8a00';
  ctx.fillRect(px - 1, py + 18 + (isMoving ? legOffset / 3 : 0), 5, 12);
  ctx.fillRect(px + 20, py + 18 - (isMoving ? legOffset / 3 : 0), 5, 12);
  // มือ
  ctx.fillStyle = '#e0a878';
  ctx.fillRect(px - 1, py + 28, 5, 4);
  ctx.fillRect(px + 20, py + 28, 5, 4);

  // คอ
  ctx.fillStyle = '#e0a878';
  ctx.fillRect(px + 9, py + 12, 6, 5);

  // หัว (สีผิว)
  ctx.fillStyle = '#e0a878';
  ctx.fillRect(px + 4, py, 16, 14);

  // ผมสั้นสีดำ
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(px + 3, py - 2, 18, 6);
  ctx.fillRect(px + 3, py, 3, 8);
  ctx.fillRect(px + 18, py, 3, 8);

  // แว่นตา (กรอบดำ + เลนส์ฟ้าอ่อนใส)
  ctx.fillStyle = '#111';
  ctx.fillRect(px + 5, py + 6, 6, 4);
  ctx.fillRect(px + 13, py + 6, 6, 4);
  ctx.fillRect(px + 11, py + 7, 2, 1); // สะพานแว่น
  ctx.fillStyle = 'rgba(180,220,255,0.6)';
  ctx.fillRect(px + 6, py + 7, 4, 2);
  ctx.fillRect(px + 14, py + 7, 4, 2);

  // ปาก (รอยยิ้มเล็กๆ)
  ctx.fillStyle = '#8a4a2a';
  ctx.fillRect(px + 9, py + 11, 4, 1);

  ctx.restore();
}

/* ---------- 3. BACKGROUND / ENVIRONMENT ---------- */
// วาดฉากห้องนั่งเล่นตอนเช้า โทนอบอุ่นสไตล์พิกเซลเรโทร
function drawBackground() {
  // ผนังห้อง (โทนครีมอุ่น)
  ctx.fillStyle = '#f4d9a8';
  ctx.fillRect(0, 0, W, GROUND_Y);

  // แสงแดดตอนเช้าลอดหน้าต่าง (มุมขวาบน)
  ctx.fillStyle = 'rgba(255, 230, 150, 0.35)';
  ctx.fillRect(W - 180, 0, 180, GROUND_Y);

  // หน้าต่างกรอบไม้ (อยู่สูงบนผนังตามธรรมชาติของหน้าต่าง แต่ขยับลงมาเล็กน้อย)
  ctx.fillStyle = '#8a5a2a';
  ctx.fillRect(W - 150, 55, 110, 90);
  ctx.fillStyle = '#bfe8ff';
  ctx.fillRect(W - 142, 63, 94, 74);
  ctx.fillStyle = '#8a5a2a';
  ctx.fillRect(W - 150, 95, 110, 6);
  ctx.fillRect(W - 100, 55, 6, 90);

  // พื้นพรมลายตาราง
  ctx.fillStyle = '#c46a3a';

  for (let i = 0; i < 5; i++) {

  ctx.fillStyle = '#5a3618';
  ctx.fillRect(20, 188, 90, GROUND_Y - 188);

  ctx.fillRect(64, 188, 2, GROUND_Y - 188); // เส้นแบ่งบานตู้ 2 บาน

  ctx.fillRect(58, 220, 3, 3);  // มือจับบานซ้าย

  // กรอบรูปครอบครัวบนผนัง (ขยับลงมา + ขยายให้พอดีกับ 3 คน)
  ctx.fillStyle = '#4a2f1a';
  ctx.fillRect(225, 90, 74, 50);
  ctx.fillStyle = '#fff8e8';
  ctx.fillRect(230, 95, 64, 40);

  // สมาชิกในภาพ 3 คน ยืนเรียงกันบนเส้นฐานเดียวกัน (feet baseline y=131)
  // 1) พ่อ - เสื้อสีส้ม (ตัวใหญ่สุด อยู่ตรงกลาง)
  ctx.fillStyle = '#e0a878';

  ctx.fillStyle = '#e0a878';

  // 3) น้องชาย - เสื้อสีฟ้า (ตัวเล็กกว่า ยืนขวามือพ่อ)
  ctx.fillStyle = '#e0a878';

  const tvTop = 240;

  // โซฟา (ขวาล่าง) - ขยับลงมาให้ขาโซฟาชนกับพื้นห้องพอดี
  ctx.fillStyle = '#c0392b';

/* ---------- 4. ITEMS (ไอเทมที่ต้องเก็บ) ---------- */
// กำหนดตำแหน่งไอเทม 5 ชิ้น กระจายในฉาก บางชิ้นอยู่สูงต้องกระโดดเก็บ
let items = [
  { type: 'cake',   x: 150, y: GROUND_Y - 24, w: 22, h: 20, collected: false },
  { type: 'beer',   x: 300, y: GROUND_Y - 22, w: 16, h: 22, collected: false },
  { type: 'car',    x: 500, y: GROUND_Y - 16, w: 26, h: 14, collected: false },
  { type: 'gift',   x: 660, y: GROUND_Y - 20, w: 20, h: 20, collected: false },
  { type: 'money',  x: 250, y: GROUND_Y - 90, w: 22, h: 14, collected: false } // ลอยสูง ต้องกระโดดเก็บ
];

function resetItems() {
  items.forEach(it => it.collected = false);
  itemsCollected = 0;
  document.getElementById('item-count').textContent = '0';
}

// วาดไอเทมแต่ละชนิดด้วยพิกเซลบล็อกง่ายๆ
function drawItem(it) {
  if (it.collected) return;
  const x = Math.round(it.x);
  const y = Math.round(it.y);

  // เอฟเฟกต์ลอยขึ้นลงเล็กน้อย (bobbing)
  const bob = Math.sin(Date.now() / 250 + it.x) * 3;
  const dy = y + bob;

  ctx.save();

  if (it.type === 'cake') {
    ctx.fillStyle = '#f7c9de';
    ctx.fillRect(x, dy + 8, 22, 12);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, dy + 8, 22, 3);
    ctx.fillStyle = '#ff4d6d';
    ctx.fillRect(x + 9, dy, 3, 8);
    ctx.fillStyle = '#ffd400';
    ctx.fillRect(x + 10, dy - 4, 1, 4);
  } else if (it.type === 'beer') {
    ctx.fillStyle = '#ffcc33';
    ctx.fillRect(x + 3, dy + 4, 10, 18);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 3, dy + 2, 10, 4);
    ctx.fillStyle = '#8a5a2a';
    ctx.fillRect(x + 13, dy + 6, 4, 8); // หูจับ
  } else if (it.type === 'car') {
    ctx.fillStyle = '#e63946';
    ctx.fillRect(x, dy + 2, 26, 8);
    ctx.fillRect(x + 5, dy - 4, 14, 8);
    ctx.fillStyle = '#bfe8ff';
    ctx.fillRect(x + 7, dy - 2, 10, 5);
    ctx.fillStyle = '#111';
    ctx.fillRect(x + 2, dy + 9, 6, 6);
    ctx.fillRect(x + 17, dy + 9, 6, 6);
  } else if (it.type === 'gift') {
    ctx.fillStyle = '#4ecdc4';
    ctx.fillRect(x, dy + 4, 20, 16);
    ctx.fillStyle = '#ffd400';
    ctx.fillRect(x + 8, dy + 4, 4, 16);
    ctx.fillRect(x, dy + 9, 20, 4);
    ctx.fillStyle = '#ffd400';
    ctx.fillRect(x + 5, dy, 3, 6);
    ctx.fillRect(x + 12, dy, 3, 6);
  } else if (it.type === 'money') {
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(x, dy + 4, 22, 12);
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(x + 2, dy + 6, 18, 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 9, dy + 8, 4, 4);
  }

  ctx.restore();
}

/* ---------- 5. PHYSICS & CONTROLS ---------- */
document.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
});

// ---- ปุ่มควบคุมบนหน้าจอ (Touch Controls) ----
// รองรับทั้งการ "แตะ" บนมือถือ (touchstart/touchend) และ "คลิกเมาส์" บนคอม (mousedown/mouseup)
// ผูกปุ่มแต่ละปุ่มเข้ากับตัวแปร keys ตัวเดียวกับที่คีย์บอร์ดใช้ เพื่อให้ logic การเคลื่อนไหวทำงานร่วมกันได้
function bindHoldButton(el, onPress, onRelease) {
  const press = (e) => {
    e.preventDefault();
    el.classList.add('active-press');
    onPress();
  };
  const release = (e) => {
    e.preventDefault();
    el.classList.remove('active-press');
    onRelease();
  };

  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });

  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release); // เผื่อลากเมาส์ออกนอกปุ่มระหว่างกด
}

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnJump = document.getElementById('jump-btn');
const touchControls = document.getElementById('touch-controls');

bindHoldButton(btnLeft, () => { keys.left = true; }, () => { keys.left = false; });
bindHoldButton(btnRight, () => { keys.right = true; }, () => { keys.right = false; });
bindHoldButton(btnJump, () => { keys.up = true; }, () => { keys.up = false; });

function updatePlayer() {
  // เดินซ้าย-ขวา
  if (keys.left) {
    player.x -= player.speed;
    player.facing = -1;
  }
  if (keys.right) {
    player.x += player.speed;
    player.facing = 1;
  }
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // แอนิเมชันขาขยับเดิน
  if (keys.left || keys.right) {
    player.walkTimer++;
    if (player.walkTimer > 8) {
      player.walkFrame = player.walkFrame === 0 ? 1 : 0;
      player.walkTimer = 0;
    }
  }

  // กระโดด
  if (keys.up && !player.jumping) {
    player.vy = JUMP_FORCE;
    player.jumping = true;
  }

  // แรงโน้มถ่วง
  player.vy += GRAVITY;
  player.y += player.vy;

  // ชนพื้น
  const floorLevel = GROUND_Y - player.h;
  if (player.y >= floorLevel) {
    player.y = floorLevel;
    player.vy = 0;
    player.jumping = false;
  }
}

/* ---------- 6. COLLISION & SCORE ---------- */
function checkCollisions() {
  items.forEach(it => {
    if (it.collected) return;
    const overlap =
      player.x < it.x + it.w &&
      player.x + player.w > it.x &&
      player.y < it.y + it.h &&
      player.y + player.h > it.y;

    if (overlap) {
      it.collected = true;
      itemsCollected++;
      document.getElementById('item-count').textContent = itemsCollected;
      playPickupSound();

      if (itemsCollected >= TOTAL_ITEMS) {
        startWinSequence();
      }
    }
  });
}

// เสียง "ติ๊ง" สั้นๆ ตอนเก็บไอเทม สร้างด้วย WebAudio (ไม่ต้องใช้ไฟล์เสียงภายนอก)
function playPickupSound() {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, actx.currentTime);
    gain.gain.setValueAtTime(0.08, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime + 0.2);
  } catch (e) { /* เบราว์เซอร์บางตัวอาจบล็อก autoplay audio ได้ ไม่เป็นไร */ }
}

/* ---------- 7. WIN SEQUENCE / SURPRISE POP-UP ---------- */
function startWinSequence() {
  gameState = 'win-transition';
  winFadeAlpha = 0;
  winTextTimer = 0;
  touchControls.classList.remove('visible'); // ซ่อนปุ่มควบคุมตอนขึ้นฉากจบ
}

function updateWinTransition() {
  // ค่อยๆ ทำจอมืดลง
  winFadeAlpha += 0.03;
  if (winFadeAlpha >= 1) {
    winFadeAlpha = 1;
    winTextTimer++;
    // รอสักครู่ให้ผู้เล่นเห็นคำว่า LEVEL CLEAR! แล้วค่อยเด้ง Pop-up
    if (winTextTimer > 70) {
      gameState = 'won';
      showBirthdayModal();
    }
  }
}

function drawWinTransition() {
  drawBackground();
  items.forEach(drawItem);
  drawPlayer();

  ctx.fillStyle = `rgba(0,0,0,${winFadeAlpha})`;
  ctx.fillRect(0, 0, W, H);

  if (winFadeAlpha > 0.5) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '28px "Press Start 2P"';
    ctx.fillStyle = '#ffd400';
    ctx.shadowColor = '#ff2e63';
    ctx.shadowBlur = 10;
    ctx.fillText('LEVEL CLEAR!', W / 2, H / 2);
    ctx.restore();
  }
}

function showBirthdayModal() {
  const modal = document.getElementById('hbd-modal');
  modal.classList.add('show');

  // เริ่มเอฟเฟกต์พลุพิกเซล
  startFireworks();

  // เล่นเพลงพื้นหลัง (ผู้ใช้ต้องใส่ไฟล์เพลงของตัวเองใน <audio id="bgm"> ด้านบน)
  const bgm = document.getElementById('bgm');
  if (bgm && bgm.querySelector('source')) {
    bgm.volume = 0.6;
    bgm.play().catch(() => { /* เบราว์เซอร์อาจต้องให้ผู้ใช้กดปุ่มก่อนถึงจะเล่นเสียงได้ */ });
  }
}

// กดปิด Pop-up แล้วกลับไปหน้า Start Screen เพื่อให้กด PRESS START เล่นใหม่ได้เรื่อยๆ
function returnToStartScreen() {
  // ปิด Pop-up
  document.getElementById('hbd-modal').classList.remove('show');

  // หยุดเพลงและรีเซ็ตเสียง
  const bgm = document.getElementById('bgm');
  if (bgm) {
    bgm.pause();
    bgm.currentTime = 0;
  }

  // หยุดและล้างเอฟเฟกต์พลุ
  fireworksActive = false;
  fireworkParticles = [];
  fwCanvas.style.display = 'none';
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

  // ซ่อน HUD / ปุ่มควบคุม แล้วโชว์หน้า Start Screen เหมือนตอนเปิดเกมครั้งแรก
  document.getElementById('hud').style.display = 'none';
  document.getElementById('instructions').style.display = 'none';
  touchControls.classList.remove('visible');
  document.getElementById('start-screen').style.display = 'flex';

  gameState = 'start';

  // วาดฉากตั้งต้นค้างไว้เบาๆ ด้านหลัง Start Screen เหมือนตอนโหลดเกมครั้งแรก
  player.x = 60;
  player.y = GROUND_Y - player.h;
  player.vy = 0;
  resetItems();
  drawBackground();
  items.forEach(drawItem);
  drawPlayer();
}

document.getElementById('hbd-close').addEventListener('click', returnToStartScreen);

/* ---------- 8. PIXEL FIREWORKS (เอฟเฟกต์พลุฉลอง) ---------- */
const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');
let fireworkParticles = [];
let fireworksActive = false;
let fireworkSpawnTimer = 0;

const FW_COLORS = ['#ff2e63', '#ffd400', '#4ad4ff', '#7bff8a', '#c77bff', '#ff8a00'];

function spawnFirework() {
  const cx = Math.random() * fwCanvas.width;
  const cy = Math.random() * fwCanvas.height * 0.6 + 30;
  const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
  const particleCount = 18;
  for (let i = 0; i < particleCount; i++) {
    const angle = (Math.PI * 2 * i) / particleCount;
    const speed = 1.5 + Math.random() * 2;
    fireworkParticles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 60,
      color: color,
      size: 3
    });
  }
}

function startFireworks() {
  fireworksActive = true;
  fwCanvas.style.display = 'block';
}

function updateFireworks() {
  if (!fireworksActive) return;

  fireworkSpawnTimer++;
  if (fireworkSpawnTimer > 40) {
    spawnFirework();
    fireworkSpawnTimer = 0;
  }

  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

  fireworkParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04; // แรงโน้มถ่วงเบาๆ กับพลุ
    p.life--;

    fwCtx.fillStyle = p.color;
    fwCtx.globalAlpha = Math.max(p.life / 60, 0);
    fwCtx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  });
  fwCtx.globalAlpha = 1;

  fireworkParticles = fireworkParticles.filter(p => p.life > 0);
}

/* ---------- 9. GAME LOOP ---------- */
function gameLoop() {
  if (gameState === 'playing') {
    updatePlayer();
    checkCollisions();

    drawBackground();
    items.forEach(drawItem);
    drawPlayer();
  } else if (gameState === 'win-transition') {
    updateWinTransition();
    drawWinTransition();
  } else if (gameState === 'won') {
    // ค้างฉากมืดพร้อมข้อความไว้ด้านหลัง Pop-up
    drawWinTransition();
    updateFireworks();
  }

  requestAnimationFrame(gameLoop);
}

/* ---------- เริ่มต้นเกมเมื่อกด PRESS START ---------- */
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('instructions').style.display = 'block';
  touchControls.classList.add('visible');

  // รีเซ็ตสถานะทั้งหมดให้เล่นใหม่ได้
  player.x = 60;
  player.y = GROUND_Y - player.h;
  player.vy = 0;
  resetItems();
  fireworkParticles = [];
  fireworksActive = false;
  fwCanvas.style.display = 'none';
  document.getElementById('hbd-modal').classList.remove('show');

  gameState = 'playing';
}

document.getElementById('press-start').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => {
  if (gameState === 'start' && (e.code === 'Enter' || e.code === 'Space')) {
    startGame();
  }
});

// วาดฉากพื้นหลังไว้ล่วงหน้าตั้งแต่หน้า Start Screen (ให้เห็นผ่านๆ ตอนโหลด)
drawBackground();
items.forEach(drawItem);
drawPlayer();

// เริ่มลูปเกม
requestAnimationFrame(gameLoop);
</script>
